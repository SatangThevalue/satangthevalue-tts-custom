[project]
name = "satangthevalue-tts-custom"
version = "0.1.0"
description = "Production-grade Thai Custom TTS Pipeline targeting ElevenLabs parity on Google Colab T4 with ONNX export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Satang The Value", email = "thanaphol369@gmail.com" }
]
dependencies = [
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "pythainlp==5.4.0",
    "phonemizer==3.4.0",
    "pypinyin==0.55.0",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "pedalboard==0.9.26",
    "faster-whisper==1.2.1",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "peft==0.21.2",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "onnxslim==0.1.98",
    "pyyaml==6.0.3",
    "tqdm==4.70.1",
    "psutil==7.2.2",
    "scipy==1.17.1",
    "numpy==2.4.6",
    "yt-dlp==2026.8.19",
    "av==18.1.0",
    "f5-tts==1.1.22",
    "vocos==0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

