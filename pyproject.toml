[project]
name = "satangthevalue-tts-custom"
version = "0.1.0"
description = "Production-grade Thai Custom TTS Pipeline targeting ElevenLabs parity on Google Colab T4 with ONNX export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Satang The Value", email = "thanaphol369@gmail.com" }
]
dependencies = [
    "accelerate>=0.33.0",
    "bitsandbytes>0.37.0; platform_machine != 'arm64' and platform_system != 'Darwin'",
    "cached_path",
    "click",
    "datasets",
    "ema_pytorch>=0.5.2",
    "gradio>=3.45.2",
    "hydra-core>=1.3.0",
    "jieba",
    "librosa",
    "matplotlib",
    "pydantic<=2.10.6",
    "pydub",
    "pypinyin",
    "safetensors",
    "soundfile",
    "tomli",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision",
    "torchdiffeq",
    "tqdm>=4.65.0",
    "transformers",
    "transformers_stream_generator",
    "vocos",
    "wandb",
    "x_transformers>=1.31.14",
    "pythainlp",
    "python-crfsuite",
    "faster_whisper>=0.10.1",
    "deep-translator",
    "ssg",
    "syllapy",
    "tltk",
    "torchcodec",
    "peft>=0.10.0",
    "pedalboard>=0.9.0",
    "yt-dlp>=2024.0.0",
    "scipy",
    "pyyaml"
]

[project.optional-dependencies]
onnx = [
    "onnxruntime>=1.17.0",
    "onnxslim>=0.1.25",
    "onnx>=1.15.0"
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

