[project]
name = "satangthevalue-tts-custom"
version = "0.1.0"
description = "Production-grade Thai Custom TTS Pipeline targeting ElevenLabs parity on Google Colab T4 with ONNX export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Satang The Value", email = "thanaphol369@gmail.com" }
]
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "pythainlp>=5.0.0",
    "phonemizer>=3.2.1",
    "pypinyin>=0.50.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "pedalboard>=0.9.0",
    "faster-whisper>=1.0.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "peft>=0.10.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "onnxslim>=0.1.25",
    "resemble-enhance>=0.0.1",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "psutil>=5.9.8",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "yt-dlp>=2024.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
